
name: Build and deploy TaskTrack to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tasktrack
  DOTNET_VERSION: '10.0.x'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        working-directory: TaskTrack
        run: dotnet restore

      - name: Build application
        working-directory: TaskTrack
        run: dotnet build --configuration Release --no-restore

      - name: Publish application
        working-directory: TaskTrack
        run: dotnet publish TaskTrack.csproj --configuration Release --no-build --output "${{ runner.temp }}/tasktrack-publish"

      - name: Upload published application
        uses: actions/upload-artifact@v4
        with:
          name: tasktrack-app
          path: ${{ runner.temp }}/tasktrack-publish/**

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download published application
        uses: actions/download-artifact@v4
        with:
          name: tasktrack-app
          path: published

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: published
